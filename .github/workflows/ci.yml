name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync lockfile
        run: uv lock --check

      - name: Install
        run: uv sync --frozen --group dev --extra http --extra sentry

      - name: Fetch pinned classifier model
        run: uv run python scripts/fetch_classifier_model.py

      - name: Ruff
        if: matrix.python-version == '3.12'
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typecheck
        if: matrix.python-version == '3.12'
        run: uv run ty check

      - name: Tests
        run: uv run pytest
